[project]
name = "kourindou-bot"
version = "1.0.0"
description = "Touhou themed Discord bot for the Gensokyolis:Re server"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "ASYNC", "S", "SIM", "RUF"]
# S311: game randomness is not security sensitive.
# RUF001-003: Spanish user facing strings contain accents and emoji.
ignore = ["S101", "S311", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.ruff.format]
quote-style = "double"
